name: openED PC & Release Installers (.deb, .exe, .apk)

on:
  push:
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional tag name to publish a GitHub Release (e.g. v1.8.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Linux Packaging Tools (fakeroot, binutils)
        run: sudo apt-get update && sudo apt-get install -y fakeroot binutils

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Desktop Unit Tests
        run: ./gradlew :desktop:test --no-daemon

      - name: Build Direct Linux .deb Installer
        run: ./gradlew :desktop:packageDeb --no-daemon

      - name: Inspect .deb Package & Compatibility Metadata
        run: |
          DEB_FILE=$(find desktop/build/compose/binaries/main/deb -maxdepth 1 -name '*.deb' | head -n 1)
          test -n "$DEB_FILE"
          dpkg-deb --info "$DEB_FILE"
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            VERSION="1.8.0"
          fi
          mkdir -p dist-linux
          cp "$DEB_FILE" "dist-linux/openED-${VERSION}-linux-amd64.deb"
          ls -lh dist-linux/

      - name: Upload Linux .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openED-linux-deb
          path: dist-linux/*.deb
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Ensure WiX Toolset v3 (required by jpackage .exe)
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
            Select-Object -First 1
          if (-not $wixBin -and (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixBin = Split-Path (Get-Command candle.exe).Source
          }
          if (-not $wixBin) {
            Write-Host "WiX Toolset not found on runner; installing wixtoolset via Chocolatey..."
            choco install wixtoolset -y --no-progress
            $wixBin = Get-ChildItem -Path "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { Test-Path (Join-Path $_ "candle.exe") } |
              Select-Object -First 1
          }
          if (-not $wixBin) {
            throw "Failed to locate WiX Toolset candle.exe / light.exe"
          }
          Write-Host "Using WiX bin: $wixBin"
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Run Desktop Unit Tests
        run: .\gradlew.bat :desktop:test --no-daemon

      - name: Build Direct Windows .exe Installer
        run: .\gradlew.bat :desktop:packageExe --no-daemon

      - name: Prepare Normalized .exe Installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "desktop\build\compose\binaries\main\exe" -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) { throw "No .exe installer found!" }
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "1.8.0" }
          New-Item -ItemType Directory -Force -Path "dist-windows" | Out-Null
          Copy-Item $exe.FullName "dist-windows\openED-${ver}-windows-x64.exe"
          Get-ChildItem "dist-windows"

      - name: Upload Windows .exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: openED-windows-exe
          path: dist-windows/*.exe
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Android Unit Tests & Build Release APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: openED-android-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-22.04
    steps:
      - name: Download Built Installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify Direct Installers Only (No .zip or .tar)
        run: |
          ls -lh release-assets/
          if find release-assets -type f \( -name '*.zip' -o -name '*.tar*' \) | grep -q .; then
            echo "Unexpected archive file found!"
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: openED ${{ inputs.release_tag || github.ref_name }} — Android APK, Linux .deb & Windows .exe
          body: |
            ### Direct Installers (No ZIP / TAR unpacking required)
            - **Linux (x64 Debian/Ubuntu/Mint/Pop!_OS):** Download `openED-*-linux-amd64.deb` and install with `sudo apt install ./openED-*-linux-amd64.deb` (includes bundled Java 21 runtime & desktop menu launcher).
            - **Windows (x64 Windows 10/11):** Download `openED-*-windows-x64.exe` and double-click to install per-user (no admin required, includes bundled Java 21 runtime & Start Menu shortcut).
            - **Android:** Download `app-release.apk`.
          files: |
            release-assets/*.deb
            release-assets/*.exe
            release-assets/*.apk
